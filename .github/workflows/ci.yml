name: CI

# Pushes run headless on the MacBook build server (`mbp-build-speedread`, Xcode 26.3), which keeps
# this load off the Studio. Never on GitHub-hosted macOS — that bills at a 10x multiplier and was
# ~92% of one project's Actions spend.
#
# The MacBook can't install Xcode 27, so it never sees iOS 27. Before a release, run the same jobs
# on the Studio (`speedread-mac`, Xcode 27), which is also what archives the release:
#   ghx workflow run CI --ref main -f ios27=true
# That run fails unless its iOS lanes really ran on iOS 27 (Scripts/lane-runtime.py).
on:
  workflow_dispatch:
    inputs:
      ios27:
        description: Run on the Studio with Xcode 27 and require iOS 27. Do this before a release.
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

# Rapid pushes must not pile Xcode builds onto a machine that also runs the operator's
# other work. Newest push wins; older runs are cancelled. An iOS 27 run is on another host, so it
# neither cancels a push's run nor gets cancelled by one.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ios27 && 'ios27' || 'default' }}
  cancel-in-progress: true

env:
  SPEEDREAD_REQUIRE_IOS_MAJOR: ${{ inputs.ios27 && '27' || '' }}

jobs:
  hermetic:
    name: Hermetic lanes + honesty gates
    runs-on: ${{ inputs.ios27 && fromJSON('["self-hosted","macOS","ARM64","speedread"]') || fromJSON('["self-hosted","macOS","mbp-build","speedread"]') }}
    timeout-minutes: 40
    steps:
      # checkout copies $HOME/.gitconfig and logs that path. On the Studio the runner runs as a
      # personal account, so the log printed its home folder on a public repo. An empty HOME
      # for this step leaves nothing to copy; checkout configures git auth itself.
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home

      # DerivedData goes on the BOOT VOLUME, not the Crucial X8. That reverses standing project
      # policy deliberately and loudly: as of 2026-09-03 xcodebuild HANGS when DerivedData lives
      # on the X8. MEASURED here 2026-09-04, same repo, same commit, same simulator, one variable:
      #   X8   -> 23m25s elapsed for 6.89s CPU, 0.0%, ZERO tests executed, no output
      #   boot -> ** TEST SUCCEEDED **, 288 iOS + 65 watchOS tests
      # Reproduced by a peer on an unrelated repo (DVTFilePath stall; os.scandir raising
      # InterruptedError on this volume). Tree size is NOT the mechanism -- 343 MB here behaves
      # exactly like their 4.6 GB. Suspected TCC on a removable volume, re-evaluated when the
      # runners restarted -- ASSUMED, not established. Revert once the volume is trusted.
      #
      # Set in a STEP, not in workflow-level env: the `runner` context does not exist up there
      # (only github, inputs, secrets, vars). Writing ${{ runner.temp }} in workflow env made
      # the file unparseable, so GitHub created no run at all -- CI silently stopped existing
      # rather than failing. RUNNER_TEMP is wiped between jobs, so growth is bounded per job.
      - name: Route DerivedData off the external volume
        run: |
          echo "SPEEDREAD_DERIVED_DATA_PATH=$RUNNER_TEMP/speedread-ci-derived-data" >> "$GITHUB_ENV"
          echo "SPEEDREAD_CLONED_SOURCE_PACKAGES_PATH=$RUNNER_TEMP/speedread-ci-spm-clones" >> "$GITHUB_ENV"

      # Cheap gates first — no simulator, fails in seconds rather than minutes.
      #
      # Scripts/honesty-gates.sh is the SINGLE list of what must be true before a build is worth
      # starting; each gate's history lives in the header of the script it runs. The list is not
      # duplicated here on purpose — it used to live in CI steps AND in CLAUDE.md prose, and a
      # list in two places is a list that disagrees with itself.
      #
      # Note the one gate this step CANNOT be trusted to provide: actionlint. If this very file
      # is unparseable, GitHub creates no run and nothing below executes. Run the script locally
      # before pushing; that is where workflow validity is actually enforced.
      - name: Honesty gates
        run: Scripts/honesty-gates.sh
      - name: External volume mounted (failure artifacts)
        run: |
          # mbp-build has no X8; its runner's .env sets SPEEDREAD_FAILURE_ARTIFACT_DIR, which the lane scripts use.
          if [ -n "${SPEEDREAD_FAILURE_ARTIFACT_DIR:-}" ]; then
            mkdir -p "$SPEEDREAD_FAILURE_ARTIFACT_DIR"
            echo "failure artifacts: $SPEEDREAD_FAILURE_ARTIFACT_DIR"
          elif [ ! -d "/Volumes/Crucial X8" ]; then
            echo "::error::/Volumes/Crucial X8 is not mounted — failure artifacts (lane logs, result bundles) have nowhere to go."
            exit 1
          fi

      # A wedged CoreSimulator hangs every iOS build with NO error output, including device
      # and archive builds, because compiling an asset catalog needs a device-type lookup.
      # Empty output here means stop, not proceed.
      - name: Simulator preflight
        run: |
          set -euo pipefail
          types=$(xcrun simctl list devicetypes | head -20)
          if [ -z "$types" ]; then
            echo "::error::CoreSimulator is wedged — no device types. Aborting before the build hangs."
            exit 1
          fi
          echo "$types" | head -3

      # One step, because Scripts/coverage.sh already IS the gate: it runs the iOS and watch
      # hermetic lanes serially, prints worst-first per-file coverage, and fails below the
      # threshold. Re-implementing the xcodebuild invocations here would only let CI and the
      # local command drift apart.
      #
      # The threshold gates ATTRIBUTABLE coverage — lines in files a test actually names —
      # per the operator's decision of 2026-08-29. Headline coverage is reported but not
      # gated, because a host-app test bundle renders views into it with no assertions behind
      # them.
      #
      # RATCHET, 2026-09-06 (fifth): raised 88 -> 89. Measured combined attributable is 91.02%
      # (11680/12833) after depth coverage of EPUBExtractor and WatchSyncService, keeping ~2 points
      # of headroom. Denominator unchanged from the previous run (12833), so this rise is entirely
      # new coverage of existing lines -- the first ratchet in this repo where that is true of the
      # whole delta.
      #
      # RATCHET, 2026-09-06 (fourth): raised 87 -> 88. Measured combined attributable is 90.21%
      # (11538/12790) after the first depth leg, keeping ~2.2 points of headroom. First leg where
      # the work was raising coverage on files already counted rather than naming new ones; the
      # denominator moved by -54 lines, so this rise is almost entirely real new coverage.
      #
      # RATCHET, 2026-09-06 (third): raised 86 -> 87. Measured combined attributable is 88.98%
      # (11429/12844) after the last five unnamed files were covered, keeping ~2 points of headroom.
      # MILESTONE: every shipping source file in this repo -- 80 of 80 -- is now named by a test.
      # "Named" was always the weak half of the metric; what makes this one worth recording is that
      # the denominator grew 676 lines in the same leg and the percentage still rose. The work left
      # is depth on files already counted: ReaderTheme 45.95%, ServerListView 65.38%,
      # ReaderSheets 73.83%, LibraryView 79.48%.
      #
      # RATCHET, 2026-09-06 (second): raised 84 -> 86. Measured combined attributable is 88.31%
      # (10745/12168) after the OPDS server surface was covered, keeping ~2.3 points of headroom.
      # The denominator grew by 1,772 lines in that leg — four view files entered it — and the
      # percentage still rose 1.6 points, which is the only shape of coverage work worth doing.
      # Also in this leg: files compiled out of Release (whole-file `#if DEBUG`) are now held out
      # of the graded denominator entirely, reported in their own NOT SHIPPING block. That moved
      # this number by zero, because the one such file was named by no test and so was never in
      # the attributable denominator to begin with.
      #
      # RATCHET, 2026-09-06: raised 82 -> 84. Measured combined attributable is 85.88%
      # (8308/9674) after the annotation lists were covered, keeping ~1.9 points of headroom, in
      # line with the margin the previous ratchet chose for the reasons below. Note the
      # denominator GREW by 671 lines in that leg and the percentage still rose — naming a file
      # moves its whole line count in, so a shallow test on a big view lowers this number. That is
      # the gate working, not the gate misfiring: the fix is more coverage, never a smaller floor.
      #
      # RATCHET, 2026-08-31: raised 80 -> 82 now that chapters have landed. Measured combined
      # attributable is 83.73% (5240/6258), so this keeps ~1.7 points of headroom. That margin is
      # deliberate: attributable moves a little on its own (0.36 points across two identical runs)
      # and a feature leg legitimately dips it while new code lands ahead of its tests. A floor set
      # flush against the current number turns ordinary work into a red build, and a gate people
      # route around is worse than no gate.
      #
      # Do NOT ratchet headline. Measured on this project the same day, headline swung 41.84% ->
      # 55.77% on the watch lane across two runs of an IDENTICAL suite — 316 of the 320 extra
      # "covered" lines were GHOST, i.e. launch-path rendering with no assertions behind it.
      - name: Hermetic lanes + attributable coverage gate
        run: Scripts/coverage.sh 90

  ui:
    name: UI lanes
    runs-on: ${{ inputs.ios27 && fromJSON('["self-hosted","macOS","ARM64","speedread"]') || fromJSON('["self-hosted","macOS","mbp-build","speedread"]') }}
    # Serial after the hermetic gate rather than parallel: the Studio cannot sustain more than
    # about two concurrent simulator-driving agents, and both hosts are the operator's own
    # machines. A UI lane that races the coverage lane gets both OS-killed.
    needs: hermetic
    timeout-minutes: 40
    steps:
      # checkout copies $HOME/.gitconfig and logs that path. On the Studio the runner runs as a
      # personal account, so the log printed its home folder on a public repo. An empty HOME
      # for this step leaves nothing to copy; checkout configures git auth itself.
      - uses: actions/checkout@v4
        env:
          HOME: ${{ runner.temp }}/checkout-home

      # DerivedData goes on the BOOT VOLUME, not the Crucial X8. That reverses standing project
      # policy deliberately and loudly: as of 2026-09-03 xcodebuild HANGS when DerivedData lives
      # on the X8. MEASURED here 2026-09-04, same repo, same commit, same simulator, one variable:
      #   X8   -> 23m25s elapsed for 6.89s CPU, 0.0%, ZERO tests executed, no output
      #   boot -> ** TEST SUCCEEDED **, 288 iOS + 65 watchOS tests
      # Reproduced by a peer on an unrelated repo (DVTFilePath stall; os.scandir raising
      # InterruptedError on this volume). Tree size is NOT the mechanism -- 343 MB here behaves
      # exactly like their 4.6 GB. Suspected TCC on a removable volume, re-evaluated when the
      # runners restarted -- ASSUMED, not established. Revert once the volume is trusted.
      #
      # Set in a STEP, not in workflow-level env: the `runner` context does not exist up there
      # (only github, inputs, secrets, vars). Writing ${{ runner.temp }} in workflow env made
      # the file unparseable, so GitHub created no run at all -- CI silently stopped existing
      # rather than failing. RUNNER_TEMP is wiped between jobs, so growth is bounded per job.
      - name: Route DerivedData off the external volume
        run: |
          echo "SPEEDREAD_DERIVED_DATA_PATH=$RUNNER_TEMP/speedread-ci-derived-data" >> "$GITHUB_ENV"
          echo "SPEEDREAD_CLONED_SOURCE_PACKAGES_PATH=$RUNNER_TEMP/speedread-ci-spm-clones" >> "$GITHUB_ENV"

      # Same re-scoping as the hermetic job: DerivedData is on the boot volume while the X8
      # hangs xcodebuild (see the env block); this guard now protects the failure-artifact path.
      - name: External volume mounted (failure artifacts)
        run: |
          # mbp-build has no X8; its runner's .env sets SPEEDREAD_FAILURE_ARTIFACT_DIR, which the lane scripts use.
          if [ -n "${SPEEDREAD_FAILURE_ARTIFACT_DIR:-}" ]; then
            mkdir -p "$SPEEDREAD_FAILURE_ARTIFACT_DIR"
            echo "failure artifacts: $SPEEDREAD_FAILURE_ARTIFACT_DIR"
          elif [ ! -d "/Volumes/Crucial X8" ]; then
            echo "::error::/Volumes/Crucial X8 is not mounted — failure artifacts (lane logs, result bundles) have nowhere to go."
            exit 1
          fi

      # Deliberately NOT part of Scripts/coverage.sh. A UI test drives the whole app through
      # its host process, so every view it walks past records as covered with nothing
      # asserting on it — the GHOST shape the attributable gate exists to reject. These lanes
      # report pass/fail and never touch the coverage number.
      - name: iOS + watchOS UI lanes
        run: Scripts/ui-lanes.sh
