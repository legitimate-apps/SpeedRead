name: CI

# Runs on the operator's own Mac via the self-hosted `speedread-mac` runner. Never on
# GitHub-hosted macOS — that bills at a 10x multiplier and was ~92% of one project's
# Actions spend.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Rapid pushes must not pile Xcode builds onto a machine that also runs the operator's
# other work. Newest push wins; older runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # DerivedData was on the external volume because the boot drive is small and DerivedData is
  # one of the biggest offenders. That routing is TEMPORARILY REVERSED, deliberately and not
  # silently, because as of 2026-09-03 xcodebuild HANGS when DerivedData lives on the X8.
  #
  # MEASURED here 2026-09-04, same repo, same commit, same simulator, one variable changed:
  #   X8   -> 23m25s elapsed for 6.89s CPU, 0.0%%, ZERO tests executed, no output
  #   boot -> ** TEST SUCCEEDED **, 288 iOS + 65 watchOS tests
  # A peer session reproduced the same effect on an unrelated repo and traced it to a
  # DVTFilePath walk stalling and to os.scandir raising InterruptedError on this volume.
  # Tree size is NOT the mechanism: 343 MB here behaves exactly like their 4.6 GB.
  # Suspected cause is TCC on a removable volume re-evaluated when the runners restarted
  # (mount ctime 2026-09-03 14:45, runners restarted 20:15, last green CI 2026-09-01) --
  # ASSUMED, not established. Revert this block once the volume is trusted again.
  SPEEDREAD_DERIVED_DATA_PATH: ${{ runner.temp }}/speedread-ci-derived-data
  SPEEDREAD_CLONED_SOURCE_PACKAGES_PATH: ${{ runner.temp }}/speedread-ci-spm-clones

jobs:
  hermetic:
    name: Hermetic lanes + honesty gates
    runs-on: [self-hosted, macOS, speedread]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Cheap gates first — this needs no simulator and fails in seconds rather than minutes.
      - name: No assertion-free tests
        run: python3 Scripts/assertion-audit.py .

      # A test can exist, be wired to a target, sit in a plan, and still never run. Both
      # seams have bitten this project: the watch unit target was in no plan and read as
      # 0.00% for months, and later UI.xctestplan / WatchUI.xctestplan were invoked by no
      # lane at all, so the test covering the operator's crown-direction bug could not have
      # failed a build. Neither gap was visible in any report.
      - name: Every target in a plan, every plan in a lane
        run: python3 Scripts/lane-audit.py

      # The fifth arrow: a test can clear every wiring check above and still be aimed at the
      # wrong copy. SpineColor.swift lived as two real files, iOS grew a themed-palette overload
      # the watch copy never got, and SpineColorTests names only the iOS one -- so the same book
      # rendered a different colour on each device with nothing able to notice. Fails on
      # byte-identical copies too: identical today is a copy that drifts tomorrow.
      - name: Shared sources are one file, not two
        run: python3 Scripts/shared-source-audit.py

      # Every "the lane is green" claim rests on a parser that counts executed tests, and a
      # parser that fails OPEN certifies an empty lane as healthy. That bug shipped here once:
      # awk regex literals passed as function arguments evaluated against $0 first, so the
      # parser returned 1 for every log including an empty one. It was caught only because a
      # control asserted an expected COUNT rather than "a number came out" -- so that control
      # is standing now instead of something someone remembered to run.
      - name: Executed-test parser reports true counts
        run: Scripts/executed-tests-control.sh

      # A file counts as "named by a test" if a test references its declared type -- and the
      # match ran over RAW source, so a doc comment reading "shared by BookmarkListView and
      # HighlightListView" marked both of those 0%-covered views as tested and dropped the
      # combined figure 6 points. The incentive that creates is the dangerous one: an accurate
      # comment lowers coverage, and the fastest way to green is to delete the comment.
      - name: Coverage classifier ignores prose, not code
        run: python3 Scripts/attributable-coverage.py --self-test

      # This guard used to protect DerivedData's routing. DerivedData now lives on the boot
      # volume (see the env block), so it protects the FAILURE-ARTIFACT path instead -- which
      # is still on the X8 and is still where a red lane's log and result bundle are kept.
      # Re-scoped rather than deleted: a guard removed for a good reason gets re-added later
      # for the old one.
      - name: External volume mounted (failure artifacts)
        run: |
          if [ ! -d "/Volumes/Crucial X8" ]; then
            echo "::error::/Volumes/Crucial X8 is not mounted — failure artifacts (lane logs, result bundles) have nowhere to go."
            exit 1
          fi

      # A wedged CoreSimulator hangs every iOS build with NO error output, including device
      # and archive builds, because compiling an asset catalog needs a device-type lookup.
      # Empty output here means stop, not proceed.
      - name: Simulator preflight
        run: |
          set -euo pipefail
          types=$(xcrun simctl list devicetypes | head -20)
          if [ -z "$types" ]; then
            echo "::error::CoreSimulator is wedged — no device types. Aborting before the build hangs."
            exit 1
          fi
          echo "$types" | head -3

      # One step, because Scripts/coverage.sh already IS the gate: it runs the iOS and watch
      # hermetic lanes serially, prints worst-first per-file coverage, and fails below the
      # threshold. Re-implementing the xcodebuild invocations here would only let CI and the
      # local command drift apart.
      #
      # The threshold gates ATTRIBUTABLE coverage — lines in files a test actually names —
      # per the operator's decision of 2026-08-29. Headline coverage is reported but not
      # gated, because a host-app test bundle renders views into it with no assertions behind
      # them.
      #
      # RATCHET, 2026-08-31: raised 80 -> 82 now that chapters have landed. Measured combined
      # attributable is 83.73% (5240/6258), so this keeps ~1.7 points of headroom. That margin is
      # deliberate: attributable moves a little on its own (0.36 points across two identical runs)
      # and a feature leg legitimately dips it while new code lands ahead of its tests. A floor set
      # flush against the current number turns ordinary work into a red build, and a gate people
      # route around is worse than no gate.
      #
      # Do NOT ratchet headline. Measured on this project the same day, headline swung 41.84% ->
      # 55.77% on the watch lane across two runs of an IDENTICAL suite — 316 of the 320 extra
      # "covered" lines were GHOST, i.e. launch-path rendering with no assertions behind it.
      - name: Hermetic lanes + attributable coverage gate
        run: Scripts/coverage.sh 82

  ui:
    name: UI lanes
    runs-on: [self-hosted, macOS, speedread]
    # Serial after the hermetic gate rather than parallel: this Mac cannot sustain more than
    # about two concurrent simulator-driving agents, and it is also the operator's own
    # machine. A UI lane that races the coverage lane gets both OS-killed.
    needs: hermetic
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Same re-scoping as the hermetic job: DerivedData is on the boot volume while the X8
      # hangs xcodebuild (see the env block); this guard now protects the failure-artifact path.
      - name: External volume mounted (failure artifacts)
        run: |
          if [ ! -d "/Volumes/Crucial X8" ]; then
            echo "::error::/Volumes/Crucial X8 is not mounted — failure artifacts (lane logs, result bundles) have nowhere to go."
            exit 1
          fi

      # Deliberately NOT part of Scripts/coverage.sh. A UI test drives the whole app through
      # its host process, so every view it walks past records as covered with nothing
      # asserting on it — the GHOST shape the attributable gate exists to reject. These lanes
      # report pass/fail and never touch the coverage number.
      - name: iOS + watchOS UI lanes
        run: Scripts/ui-lanes.sh
